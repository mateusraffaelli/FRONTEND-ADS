<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        var contador = 0

        function incrementar(){
            contador++
            document.getElementById('numero').innerText = contador
        }
    </script>
</head>
<body>
    <h1>Anos 90 ao inicio dos anos 2000</h1>
    <h2>Sites estáticos</h2>
    <p>Acertou o botão <span id="numero">0</span> vezes</p>
    <button onclick="incrementar()">Clique aqui</button>
</body>
</html>
