<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - RetroPlay Store</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>


<main>

    <section class="pagina-hero">
        <h1>Criar Conta</h1>
        <p>Cadastre-se para comprar na RetroPlay Store</p>
    </section>

    <div class="container">
        <div class="card-box">
            <h2>Novo Cliente</h2>
            <div id="alerta-cadastro"></div>
            <form id="form-cadastro" novalidate>
                <div class="form-grupo">
                    <label for="cad-nome">Nome Completo *</label>
                    <input type="text" id="cad-nome" placeholder="Seu nome completo" maxlength="100" required>
                </div>
                <div class="form-grupo">
                    <label for="cad-email">E-mail *</label>
                    <input type="email" id="cad-email" placeholder="seu@email.com" required>
                </div>
                <div class="form-grupo">
                    <label for="cad-cpf">CPF *</label>
                    <input type="text" id="cad-cpf" placeholder="000.000.000-00" maxlength="14" required>
                </div>
                <div class="form-grupo">
                    <label for="cad-tel">Telefone</label>
                    <input type="text" id="cad-tel" placeholder="(48) 99999-0000" maxlength="20">
                </div>

                <hr class="separador">
                <h3 style="margin-bottom:10px; font-size:16px; color:#555;">Endereço</h3>

                <div class="form-grupo">
                    <label for="cad-cep">CEP *</label>
                    <input type="text" id="cad-cep" placeholder="00000-000" maxlength="9" required>
                </div>
                <div class="form-grupo">
                    <label for="cad-rua">Rua *</label>
                    <input type="text" id="cad-rua" placeholder="Nome da rua" maxlength="200" required>
                </div>
                <div class="form-linha">
                    <div class="form-grupo">
                        <label for="cad-numero">Número *</label>
                        <input type="text" id="cad-numero" placeholder="Nº" maxlength="10" required>
                    </div>
                    <div class="form-grupo">
                        <label for="cad-complemento">Complemento</label>
                        <input type="text" id="cad-complemento" placeholder="Apto, bloco..." maxlength="100">
                    </div>
                </div>

                <hr class="separador">

                <div class="form-grupo">
                    <label for="cad-senha">Senha *</label>
                    <input type="password" id="cad-senha" placeholder="Minimo 6 caracteres" minlength="6" required>
                </div>
                <div class="form-grupo">
                    <label for="cad-senha2">Confirmar Senha *</label>
                    <input type="password" id="cad-senha2" placeholder="Repita a senha" required>
                </div>
                <button type="submit" class="btn btn-vermelho btn-bloco">Cadastrar</button>
            </form>
            <p style="text-align:center; margin-top:15px; font-size:14px; color:#666;">
                Ja tem conta? <a href="login.html">Faça login</a>
            </p>
        </div>
    </div>

</main>

<script>
    window.location.replace('login.html');
</script>

</body>
</html>
